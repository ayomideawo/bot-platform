<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; color:#e0e0e0; font-family:'Segoe UI',system-ui,sans-serif; padding:20px; }
.container { max-width:900px; margin:0 auto; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; padding-bottom:20px; border-bottom:1px solid #222; }
h1 { color:#00c853; }
.btn { padding:10px 20px; background:#00c853; color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
.btn.outline { background:transparent; border:1px solid #444; color:#ccc; }
.card { background:#121212; border:1px solid #222; padding:25px; border-radius:12px; margin-bottom:20px; }
.card h2 { color:#00c853; font-size:1.1rem; margin-bottom:15px; }
input[type=text], input[type=password] { width:100%; padding:12px; background:#0a0a0a; border:1px solid #333; border-radius:8px; color:#fff; font-size:0.95rem; }
input:focus { outline:none; border-color:#00c853; }
.hint { color:#666; font-size:0.8rem; margin-top:8px; }
.cmd-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-top:10px; max-height:400px; overflow-y:auto; padding-right:10px; }
.cmd { display:flex; align-items:center; gap:10px; padding:10px; background:#0a0a0a; border:1px solid #222; border-radius:8px; cursor:pointer; }
.cmd:hover { border-color:#00c853; }
.cmd input[type=checkbox] { width:auto; }
.cmd-label { font-size:0.85rem; }
.info { background:#0a0a0a; border:1px solid #222; padding:15px; border-radius:8px; margin-top:15px; font-size:0.9rem; }
.info strong { color:#00c853; }
.status { padding:4px 12px; border-radius:20px; font-size:0.8rem; display:inline-block; margin-left:10px; }
.status.on { background:rgba(0,200,83,0.2); color:#00c853; }
.status.off { background:rgba(255,68,68,0.2); color:#ff4444; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🤖 Dashboard</h1>
        <div>
            <span id="userEmail"></span>
            <button class="btn outline" onclick="logout()" style="margin-left:15px;">Logout</button>
        </div>
    </div>

    <div class="card">
        <h2>1. Connect Your Bot</h2>
        <p style="color:#888; font-size:0.9rem; margin-bottom:15px;">
            Create a bot on Telegram with <strong style="color:#00c853;">@BotFather</strong> → send <code>/newbot</code> → copy the token.
        </p>
        <input type="password" id="botToken" placeholder="Paste your bot token (e.g. 123456:ABC...)">
        <div class="hint" id="botStatus"></div>
    </div>

    <div class="card">
        <h2>2. Pick Your Commands</h2>
        <div style="margin-bottom:10px;">
            <button class="btn outline" onclick="selectAll()">Select All</button>
            <button class="btn outline" onclick="clearAll()">Clear</button>
        </div>
        <div class="cmd-grid" id="cmdGrid"></div>
    </div>

    <button class="btn" onclick="save()" style="width:100%; padding:16px; font-size:1rem;">Save & Launch Bot</button>
</div>

<script>
let commands = [];

async function loadUser() {
    try {
        const res = await fetch('/api/me');
        if (!res.ok) { window.location.href = '/login.html'; return; }
        const user = await res.json();
        document.getElementById('userEmail').textContent = user.email;

        if (user.bot_token) {
            document.getElementById('botToken').value = user.bot_token;
            document.getElementById('botStatus').innerHTML =
                `✅ Bot connected: <strong>@${user.bot_username}</strong>`;
        }

        const cmdsRes = await fetch('/api/commands');
        commands = await cmdsRes.json();
        const enabled = JSON.parse(user.enabled_commands || '[]');
        renderCommands(enabled);
    } catch (e) {
        window.location.href = '/login.html';
    }
}

function renderCommands(enabled) {
    const grid = document.getElementById('cmdGrid');
    grid.innerHTML = commands.map(c => `
        <label class="cmd">
            <input type="checkbox" value="${c.id}" ${enabled.includes(c.id) ? 'checked' : ''}>
            <span class="cmd-label">/${c.id} — ${c.name}</span>
        </label>
    `).join('');
}

function selectAll() { document.querySelectorAll('#cmdGrid input').forEach(c => c.checked = true); }
function clearAll() { document.querySelectorAll('#cmdGrid input').forEach(c => c.checked = false); }

async function save() {
    const token = document.getElementById('botToken').value.trim();
    const selected = [...document.querySelectorAll('#cmdGrid input:checked')].map(c => c.value);

    if (!token) return alert('Paste your bot token first');
    if (!selected.length) return alert('Pick at least one command');

    const res = await fetch('/api/bot/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bot_token: token, enabled_commands: selected })
    });
    const data = await res.json();
    if (data.error) return alert('Error: ' + data.error);
    document.getElementById('botStatus').innerHTML = `✅ Bot launched: <strong>@${data.username}</strong>`;
    alert('✅ Bot is live! Open Telegram and try /start');
}

async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login.html';
}

loadUser();
</script>
</body>
</html>
